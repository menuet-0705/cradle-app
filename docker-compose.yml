# ローカル開発専用。検証/本番は Supabase Postgres を使う（接続先は backend の環境変数で切り替える）
# Supabase と同じメジャーバージョンに揃える
services:
  db:
    image: postgres:17-alpine
    container_name: cradle-db
    environment:
      POSTGRES_USER: cradle
      POSTGRES_PASSWORD: cradle
      POSTGRES_DB: cradle
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cradle -d cradle"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
